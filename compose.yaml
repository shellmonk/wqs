# Local infrastructure for running WQS on a laptop (Colima works):
#   docker compose up -d                      Postgres and RabbitMQ only (run the app from the IDE or bootRun)
#   ./gradlew bootJar && docker compose --profile app up -d --build    ... and the app in a container
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wqs
      POSTGRES_USER: wqs
      POSTGRES_PASSWORD: wqs
    ports:
      - "55432:5432" # host port 55432, so it does not clash with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    # Streams need the plugin, and clients connect to the advertised host/port, so advertise
    # the address the host machine sees.
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_stream advertised_host localhost"
    configs:
      - source: rabbit_plugins
        target: /etc/rabbitmq/enabled_plugins
    ports:
      - "5552:5552"   # stream protocol
      - "15672:15672" # management UI (guest/guest)

  wqs:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wqs
      WQS_STREAM_ENABLED: "true"
      WQS_STREAM_URI: rabbitmq-stream://rabbitmq:5552
      # The broker advertises localhost (for clients on the host); this container must use the service name.
      WQS_STREAM_CONNECT_HOST: rabbitmq
      # Local and trusted only: there is no authentication yet.
      WQS_API_CC_ENABLED: "true"
      WQS_API_WEB_OWNER_HEADER: "true"
    ports:
      - "8080:8080"
    restart: on-failure

configs:
  rabbit_plugins:
    content: "[rabbitmq_management,rabbitmq_stream]."

volumes:
  pgdata:
