spring:
  application:
    name: wqs
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:55432/wqs   # the compose.yaml database
    username: wqs
    password: wqs
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
      naming:
        # Column and table names are the entity's own camelCase names, quoted.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never   # Flyway owns all DDL, including Quartz's.
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: wqs
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.tablePrefix: quartz.QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.threadPool.threadCount: 4
    # Clustered Quartz coordinates through database locks: nodes need synchronised clocks (NTP)
    # and distinct instance ids.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

wqs:
  api:
    # No authentication yet: both endpoints are closed until switched on, on a trusted network only.
    cc-enabled: false          # /cc serves any player to any caller
    web-player-header: false   # /web trusts an X-Player-Id header any caller can set
  datasource:
    reader:
      # url/username/password fall back to spring.datasource.* when unset.
      hikari:
        maximum-pool-size: 32
  stream:
    # Exactly one replica may consume the stream: WQS_STREAM_ENABLED=true on that one only.
    enabled: false
    uri: rabbitmq-stream://localhost:5552
    name: wallet-transactions
    # Messages are committed in batches: up to batch-size, or what arrived within batch-max-wait.
    batch-size: 500
    batch-max-wait: 200ms
  partition:
    # A row whose month is before floor or after now + max-months-ahead has a garbage timestamp:
    # it is dead-lettered and creates no partition.
    floor: 2010-01
    max-months-ahead: 12
