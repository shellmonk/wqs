plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'wqs'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

// Spring Boot's BOM pins org.testcontainers:*; this property is its documented override.
ext['testcontainers.version'] = '1.21.4'

def mapstructVersion = '1.6.3'
def lombokVersion = '1.18.36'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.rabbitmq:stream-client:0.18.0'
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    // Order matters: lombok, then the binding, then mapstruct.
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.awaitility:awaitility'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Amapstruct.unmappedTargetPolicy=ERROR', '-parameters'])
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'benchmark' }
}

// Read-side benchmark (src/test/java/wqs/benchmark): seeds ~3M rows into its own Postgres
// container and writes build/benchmark/read-benchmark.md. Opt-in: never part of `build`.
tasks.register('benchmark', Test) {
    description = 'Runs the read-side benchmark (tag benchmark).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'benchmark' }
    maxHeapSize = '2g'
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// Publishes generated wallet messages to the local stream (docker compose):
//   ./gradlew publishSamples [-Pcount=200] [-Pplayer=1717]
tasks.register('publishSamples', JavaExec) {
    description = 'Publishes sample walAccountTransactions messages to the local RabbitMQ stream.'
    group = 'application'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'wqs.tools.PublishSamples'
    args = [project.findProperty('count') ?: '200', project.findProperty('player') ?: '1717',
            project.findProperty('streamUri') ?: 'rabbitmq-stream://localhost:5552']
}
