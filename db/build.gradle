plugins {
    id 'java-library'
    alias(libs.plugins.springDependencyManagement)
}

dependencyManagement {
    imports { mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}" }
}

def generatedSrc = layout.buildDirectory.dir('generated-src/jooq')

sourceSets {
    main {
        // Populated by `generateJooq`, which compileJava depends on below.
        java.srcDir(generatedSrc)
    }
    codegen {
        java.srcDir('src/codegen/java')
        compileClasspath += configurations.runtimeClasspath
        // CodegenRunner points Flyway at "classpath:db/migration", which lives in main's
        // resources. configurations.runtimeClasspath (added to compileClasspath above) is
        // dependency jars only, not main's own output, so it must be added separately here
        // for the migrations to actually be found at generateJooq runtime. Using the raw
        // source directory (rather than sourceSets.main.output) avoids a task dependency on
        // :db:compileJava, which would otherwise cycle back through generateJooq -> classes
        // -> compileJava -> generateJooq.
        runtimeClasspath += files('src/main/resources')
    }
}

dependencies {
    api libs.jooq

    codegenImplementation libs.jooq.codegen
    codegenImplementation libs.jooq.meta
    codegenImplementation libs.flyway.core
    codegenImplementation libs.flyway.postgresql
    codegenImplementation libs.postgresql
    codegenImplementation libs.testcontainers.postgresql
}

/**
 * Generates jOOQ classes from the Flyway-migrated schema inside a throwaway
 * Postgres container. Docker is therefore a BUILD dependency, not only a test
 * dependency (spec section 8.3).
 *
 * Wired into compileJava below: `generatedSrc` is part of the `main` source set, and
 * compileJava depends on this task. The declared inputs/outputs make it UP-TO-DATE
 * (and therefore skip starting a container) whenever the migrations and the strategy
 * haven't changed.
 */
def generateJooq = tasks.register('generateJooq', JavaExec) {
    group = 'build'
    description = 'Generate jOOQ classes from Flyway migrations via Testcontainers'

    def outputDir = generatedSrc.get().asFile

    classpath = sourceSets.codegen.runtimeClasspath
    mainClass = 'wqs.codegen.CodegenRunner'
    args outputDir.absolutePath

    // Always generate into an empty directory. jOOQ sweeps stale files from its own output,
    // but on a case-insensitive filesystem a class rename that differs only in case
    // (Wqwebitem.java -> WqWebItem.java) overwrites the existing file while the directory
    // entry keeps the OLD spelling, so the sweep then deletes it as an orphan. Measured
    // once: a run that reported success and emitted no table classes at all.
    doFirst {
        if (outputDir.exists() && !outputDir.deleteDir()) {
            throw new GradleException("could not clear $outputDir")
        }
    }

    inputs.dir('src/main/resources/db/migration')
    // JavaExec.getClasspath() is not an annotated task input, so the jOOQ jars and the
    // compiled strategy are invisible to the up-to-date check unless declared here. Without
    // this a jooq version bump leaves the task UP-TO-DATE and compiles the previous version's
    // generated source against the new runtime. Subsumes the codegen sources, whose compiled
    // output is on this classpath.
    inputs.files(sourceSets.codegen.runtimeClasspath)
    outputs.dir(generatedSrc)
}

tasks.named('compileJava') { dependsOn(generateJooq) }

def checkMigrationQuoting = tasks.register('checkMigrationQuoting', MigrationQuotingCheck) {
    group = 'verification'
    description = 'Fail if any migration contains an unquoted camelCase identifier'
    migrations.from(fileTree('src/main/resources/db/migration'))
}

tasks.named('check') { dependsOn(checkMigrationQuoting) }
