[versions]
springBoot = "3.4.1"
mapstruct = "1.6.3"
lombok = "1.18.36"
lombokMapstructBinding = "0.2.0"
testcontainers = "1.21.4"
jqwik = "1.9.2"
archunit = "1.3.0"
rabbitmqStream = "0.18.0"
postgresql = "42.7.4"
assertj = "3.26.3"

[libraries]
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jqwik-spring = { module = "net.jqwik:jqwik-spring", version = "0.12.0" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
rabbitmq-stream-client = { module = "com.rabbitmq:stream-client", version.ref = "rabbitmqStream" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version = "1.1.7" }
