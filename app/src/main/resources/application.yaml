spring:
  application:
    name: wqs
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  quartz:
    job-store-type: jdbc
    # Flyway owns all DDL, including Quartz's.
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: wqs
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.tablePrefix: quartz.QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.threadPool.threadCount: 4
  # Clustered Quartz coordinates through database locks and compares node clocks.
  # Nodes MUST have synchronised time (NTP) and distinct instance ids; clock skew
  # produces duplicate or missed fires (spec section 6.5).

wqs:
  stream:
    # Off by default so broker-less contexts (tests, tooling) start. Deployments enable it with
    # WQS_STREAM_ENABLED=true (Spring relaxed binding).
    enabled: false
    name: wallet-transactions
    uri: rabbitmq-stream://localhost:5552
  partition:
    # On-demand partition provisioning (spec 5.8). An event whose month is after now +
    # max-months-ahead, or before provision-floor, is a garbage timestamp: it is dead-lettered and
    # no partition is created. The floor bounds how many partitions a stream of garbage timestamps
    # can create to (now + max-months-ahead - floor) months x tables; set it to the earliest month
    # of real history (deep replays from offset 0 provision everything after it).
    max-months-ahead: 12
    provision-floor: 2010-01
  jobs:
    partition-rollover:
      enabled: true
      cron: "0 0 3 * * ?"
      misfirePolicy: DO_NOTHING
      params:
        monthsAhead: "3"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: wqs
