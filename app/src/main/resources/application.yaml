spring:
  datasource:
    hikari:
      maximum-pool-size: 12
  application:
    name: wqs
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  quartz:
    job-store-type: jdbc
    # Flyway owns all DDL, including Quartz's.
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz.scheduler.instanceName: wqs
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.tablePrefix: quartz.QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.threadPool.threadCount: 4
  # Clustered Quartz coordinates through database locks and compares node clocks.
  # Nodes MUST have synchronised time (NTP) and distinct instance ids; clock skew
  # produces duplicate or missed fires (spec section 6.5).

wqs:
  datasource:
    reader:
      # url/username/password fall back to spring.datasource.* when unset.
      hikari:
        maximum-pool-size: 32
  # read:
    # Optional page-size ceiling (spec 7.9). Ships disabled (unset): any pageSize is honoured.
    # When set, larger requests are clamped to it and the response reports the effective size.
    # max-page-size: 1000
  web:
    principal:
      # How /web establishes its user (spec 9, D2; mechanism open as O-2). none (the default):
      # every /web request is 401. trusted-header: the user id is read from `header`
      # (default X-Authenticated-User-Id), which the gateway MUST set and MUST strip from client
      # requests -- WQS cannot tell a forged header from a real one. Exactly one value is accepted.
      mode: none
      # header: X-Authenticated-User-Id
      # Leave header unset for the default. Set-but-blank, or not an HTTP token, fails startup.
  cc:
    # O-14: /cc has no authentication yet; open only on a trusted network.
    # deny (the default): every /cc request is 403. open: /cc serves any userId to any caller
    # (a WARN is logged at startup). Any other value fails startup.
    access: deny
  einstant:
    # Product types that are eInstant (spec 4.1, D3), matched exactly. An eInstant transaction without a
    # batchId is dead-lettered at ingest (einstant-unsessioned, D7). A blank entry fails startup.
    product-types: instants
  stream:
    # Off by default so broker-less contexts (tests, tooling) start. Deployments enable it with
    # WQS_STREAM_ENABLED=true (Spring relaxed binding).
    # EXACTLY ONE replica may set WQS_STREAM_ENABLED=true. Nothing yet enforces it (single-active-
    # consumer / advisory lock is deferred): two consumers would both project and race on the
    # stored offset (spec 6.1). A WARN is logged at startup on every replica where it is off.
    enabled: false
    name: wallet-transactions
    uri: rabbitmq-stream://localhost:5552
  partition:
    # On-demand partition provisioning (spec 5.8). An event whose month is after now +
    # max-months-ahead, or before provision-floor, is a garbage timestamp: it is dead-lettered and
    # no partition is created. The floor bounds how many partitions a stream of garbage timestamps
    # can create to (now + max-months-ahead - floor) months x tables; set it to the earliest month
    # of real history (deep replays from offset 0 provision everything after it).
    max-months-ahead: 12
    provision-floor: 2010-01
  delta:
    # The /wallet/delta poll (spec 4, phase 6 plan D1-D10). Wire details are configuration; the
    # endpoint is open (no auth). base-url has no default: set it (WQS_DELTA_BASE_URL) together
    # with wqs.jobs.delta-poll.enabled=true. A run without it fails and is retried next fire.
    # base-url: http://wallet:8080
    cursor-param: from
    page-limit: 1000
    overlap: 120s
    max-pages-per-run: 20
    connect-timeout: 2s
    read-timeout: 10s
    # sources: { walPayments: PAYMENT, walClaimablePrizes: CLAIMABLE_PRIZE,
    #            walManualAdjustmentRequests: MANUAL_ADJUSTMENT, walLimits: LIMIT }
  jobs:
    delta-poll:
      # Closed by default, like the stream (D9). @DisallowConcurrentExecution makes it one
      # sequential writer cluster-wide; misfires are dropped -- the watermark catches up.
      enabled: false
      intervalSeconds: 5
      misfirePolicy: DO_NOTHING
    partition-rollover:
      enabled: true
      cron: "0 0 3 * * ?"
      misfirePolicy: DO_NOTHING
      params:
        monthsAhead: "3"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: wqs
