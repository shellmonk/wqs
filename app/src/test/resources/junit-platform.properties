# jqwik's default BOUNDED shrinking runs on an async thread and abandons it at the time limit,
# while the abandoned try keeps writing to the shared test Postgres -- racing the next test
# (deadlocks, strict counter-updater failures, a misleading counterexample). FULL shrinks on the
# test thread. Every DB-backed property (P-1..P-6) depends on this.
jqwik.shrinking.default = FULL
